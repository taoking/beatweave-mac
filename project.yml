name: BeatWeave
options:
  bundleIdPrefix: com.taoking
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  BeatWeave:
    type: application
    platform: macOS
    sources:
      - path: BeatWeave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoking.BeatWeave
        PRODUCT_NAME: BeatWeave
        INFOPLIST_FILE: BeatWeave/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: BeatWeave/App/BeatWeave.entitlements
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - BeatWeaveTests
  BeatWeaveTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeatWeaveTests
    dependencies:
      - target: BeatWeave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taoking.BeatWeaveTests
        GENERATE_INFOPLIST_FILE: YES
